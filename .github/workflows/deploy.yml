name: Deploy to GitHub Pages

on:
  push:
    # main only. Pages deploys from one branch, so a run on any other branch
    # fails at the deploy step — and because every run shares the "pages"
    # concurrency group with cancel-in-progress, a branch push landing just
    # after a main push would cancel the deploy that was going to work.
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        # Pages serves the site from /<repo>/, so the bundle needs that base.
        run: pnpm build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - name: Single-page fallback
        run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
        with:
          # Turn Pages on the first time this runs, rather than failing.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
